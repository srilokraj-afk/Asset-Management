spring.application.name=asset-lifecycle-service
server.port=${SERVER_PORT:8085}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=${ASSET_DATASOURCE_URL:jdbc:postgresql://localhost:5433/asset}
spring.datasource.username=${ASSET_DATASOURCE_USERNAME:asset}
spring.datasource.password=${ASSET_DATASOURCE_PASSWORD:asset}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

